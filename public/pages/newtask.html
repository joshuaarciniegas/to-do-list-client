<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create New Task — ListUp</title>

  <!-- Google Fonts connection -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../previews/WhatsApp-Image-2025-09-28-at-11.02.45-PM.ico">

  <!-- Page-specific CSS -->
  <link rel="stylesheet" href="../css/newtask.css">
</head>
<body>
  <div class="frame">
    <!-- Sidebar with logo and description -->
    <aside class="sidebar">
      <div class="brand">
        <img src="../previews/todolist.png" alt="ListUp Logo">
        <div>
          <h1>ListUp</h1>
          <p>Create Task</p>
        </div>
      </div>
      <!-- Back button redirects to task list -->
      <a href="tasks.html" class="btn-back">← Back to Home</a>
    </aside>

    <!-- Main area for creating a new task -->
    <main class="main">
      <div class="card">
        <h2>CREATE NEW TASK</h2>

        <!-- Task creation form -->
        <form id="formTarea">
          <!-- Task title field -->
          <label for="titulo">Title:</label>
          <input type="text" id="titulo" name="title" required>

          <!-- Task detail field -->
          <label for="detalle">Detail:</label>
          <input type="text" id="detalle" name="detail" required>

          <!-- Task date field -->
          <label for="fecha">Date:</label>
          <input type="date" id="fecha" name="date" required>

          <!-- Task time field -->
          <label for="hora">Time:</label>
          <input type="time" id="hora" name="time" required>

          <!-- Task status field -->
          <label for="estado">Status:</label>
          <select id="estado" name="status" required>
            <option value="Por hacer">To Do</option>
            <option value="Haciendo">In Progress</option>
            <option value="Hecho">Done</option>
          </select>

          <!-- Submit button to save the task -->
          <button type="submit" class="btn-guardar">SAVE</button>
        </form>
      </div>
    </main>
  </div>

  <!-- Script containing task creation logic -->
  <script src="../js/tasks.js"></script>
</body>
</html>
