<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Edit Task — ListUp</title>

  <!-- Google Fonts connection -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../previews/WhatsApp-Image-2025-09-28-at-11.02.45-PM.ico">

  <!-- Page-specific CSS -->
  <link rel="stylesheet" href="../css/editask.css">
</head>
<body>
  <div class="frame">

    <!-- Sidebar with logo and description -->
    <aside class="sidebar">
      <div class="brand">
        <img src="../previews/todolist.png" alt="ListUp Logo">
        <div>
          <h1>ListUp</h1>
          <p>Task Editing</p>
        </div>
      </div>
      <!-- Back button to return to task list -->
      <a href="tasks.html" class="btn-back">← Back to Home</a>
    </aside>

    <!-- Main section for editing the task -->
    <main class="main">
      <div class="card">
        <h2>EDIT TASK</h2>

        <!-- Edit task form -->
        <form id="formEditarTarea">

          <!-- Task title field -->
          <label for="titulo">Title:</label>
          <input type="text" id="titulo" name="titulo" required value="Tarea ejemplo">

          <!-- Task detail field -->
          <label for="detalle">Detail:</label>
          <input type="text" id="detalle" name="detalle" required value="Detalle de ejemplo">

          <!-- Task date field -->
          <label for="fecha">Date:</label>
          <input type="date" id="fecha" name="fecha" required value="2025-09-12">

          <!-- Task time field -->
          <label for="hora">Time:</label>
          <input type="time" id="hora" name="hora" required value="12:00">

          <!-- Task status field -->
          <label for="estado">Status:</label>
          <select id="estado" name="estado" required>
            <option value="Por hacer">To Do</option>
            <option value="Haciendo" selected>In Progress</option>
            <option value="Hecho">Done</option>
          </select>

          <!-- Submit button to save changes -->
          <button type="submit" class="btn-guardar">UPDATE</button>
        </form>
      </div>
    </main>
  </div>

  <!-- Script handling task editing logic -->
  <script src="../js/editasks.js"></script>
</body>
</html>
