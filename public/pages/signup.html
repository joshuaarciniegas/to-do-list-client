<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign Up — ListUp</title>

  <!-- Google Fonts connection -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../previews/WhatsApp-Image-2025-09-28-at-11.02.45-PM.ico">

  <!-- CSS specific to the sign-up page -->
  <link rel="stylesheet" href="../css/signup.css">
</head>
<body>
  <div class="frame">
    <!-- Sidebar with logo and description -->
    <aside class="sidebar">
      <div class="brand">
        <img src="../previews/todolist.png" alt="ListUp Logo">
        <div>
          <h1>ListUp</h1>
          <p>Sign Up</p>
        </div>
      </div>
    </aside>

    <!-- Main area for user registration -->
    <main class="main">
      <div class="card">
        <h2>SIGN UP</h2>

        <!-- Registration form -->
        <form id="sign-up">
          <!-- First name input -->
          <label for="name">First Name:</label>
          <input type="text" id="name" name="firstName" placeholder="First Name" required>

          <!-- Last name input -->
          <label for="lastname">Last Name:</label>
          <input type="text" id="lastname" name="lastName" placeholder="Last Name" required>

          <!-- Age input -->
          <label for="age">Age:</label>
          <input type="number" id="age" name="age" min="13" placeholder="Your age" required>

          <!-- Email input -->
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="example@email.com" required>

          <!-- Password input -->
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>

          <!-- Confirm password input -->
          <label for="confirm-password">Confirm Password:</label>
          <input type="password" id="confirm-password" name="confirmPassword" placeholder="••••••••" required>

          <!-- Submit button -->
          <button type="submit">SIGN UP</button>

          <!-- Link to go back to login if the user already has an account -->
          <a href="../index.html" class="back-login">Already have an account? Log in</a>
        </form>
      </div>
    </main>
  </div>

  <!-- Script that contains the registration logic and validations -->
  <script src="../js/auth.js"></script>
</body>
</html>
