<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Editar Perfil — ListUp</title>

  <!-- Conexión a Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS específico de la página -->
  <link rel="stylesheet" href="../css/editprofile.css">
</head>
<body>
  <div class="frame">
    <!-- Sidebar con logo y descripción -->
    <aside class="sidebar">
      <div class="brand">
        <img src="../previews/todolist.png" alt="Logo ListUp">
        <div>
          <h1>ListUp</h1>
          <p>Edicion de perfil</p>
        </div>
      </div>
      <!-- Botón de volver al inicio -->
      <a href="tasks.html" class="btn-back">← Volver al inicio</a>
    </aside>

    <!-- Área principal de edición de perfil -->
    <main class="main">
      <div class="card">
        <h2>EDITAR PERFIL</h2>

        <!-- Formulario de edición de perfil -->
        <form id="editProfileForm">
          <!-- Campo de nombre -->
          <label for="firstName">Nombre:</label>
          <input type="text" id="firstName" name="firstName" required>

          <!-- Campo de apellido -->
          <label for="lastName">Apellido:</label>
          <input type="text" id="lastName" name="lastName" required>

          <!-- Campo de edad -->
          <label for="age">Edad:</label>
          <input type="number" id="age" name="age" min="13" required>

          <!-- Campo de correo electrónico -->
          <label for="email">Correo:</label>
          <input type="email" id="email" name="email" required>

          <!-- Botones de acción -->
          <div class="button-group">
            <button type="submit" class="btn-guardar">GUARDAR CAMBIOS</button>
            <button type="button" class="btn-cancelar" onclick="cancelarEdicion()">CANCELAR</button>
          </div>
        </form>
      </div>
    </main>
  </div>

<script src="../js/profile.js"></script>
</body>
</html>
