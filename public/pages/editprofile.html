<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Edit Profile — ListUp</title>

  <!-- Google Fonts connection -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../previews/WhatsApp-Image-2025-09-28-at-11.02.45-PM.ico">

  <!-- Page-specific CSS -->
  <link rel="stylesheet" href="../css/editprofile.css">
</head>
<body>
  <div class="frame">

    <!-- Sidebar with logo and description -->
    <aside class="sidebar">
      <div class="brand">
        <img src="../previews/todolist.png" alt="ListUp Logo">
        <div>
          <h1>ListUp</h1>
          <p>Profile Editing</p>
        </div>
      </div>
      <!-- Back button to return to tasks -->
      <a href="tasks.html" class="btn-back">← Back to Home</a>
    </aside>

    <!-- Main section for profile editing -->
    <main class="main">
      <div class="card">
        <h2>EDIT PROFILE</h2>

        <!-- Profile editing form -->
        <form id="editProfileForm">

          <!-- First name field -->
          <label for="firstName">First Name:</label>
          <input type="text" id="firstName" name="firstName" required>

          <!-- Last name field -->
          <label for="lastName">Last Name:</label>
          <input type="text" id="lastName" name="lastName" required>

          <!-- Age field -->
          <label for="age">Age:</label>
          <input type="number" id="age" name="age" min="13" required>

          <!-- Email field -->
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>

          <!-- Action buttons -->
          <div class="button-group">
            <!-- Save changes button -->
            <button type="submit" class="btn-guardar">SAVE CHANGES</button>
            <!-- Cancel button triggers cancelarEdicion() -->
            <button type="button" class="btn-cancelar" onclick="cancelarEdicion()">CANCEL</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <!-- Script handling profile logic -->
  <script src="../js/profile.js"></script>
</body>
</html>
