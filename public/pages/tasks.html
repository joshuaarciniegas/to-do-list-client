<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Task List - Kanban — ListUp</title>

  <!-- Google Fonts connection -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../previews/WhatsApp-Image-2025-09-28-at-11.02.45-PM.ico">

  <!-- CSS specific to the tasks page -->
  <link rel="stylesheet" href="../css/tasks.css">
</head>
<body>
  <div class="container">

    <!-- Page header -->
    <header class="header">
      <div class="header-left">
        <!-- Hamburger button -->
        <span class="hamburger" id="hamburger">☰</span>

        <!-- Sidebar menu -->
        <nav class="side-menu" id="sideMenu">
          <!-- Close button -->
          <button class="close-btn" id="closeBtn">✖</button>
          <ul>
            <li><a href="#" onclick="goToProfile()">Profile</a></li>
            <li><a href="#" onclick="goToAboutUs()">About us</a></li>
            <li><a href="#" onclick="goToDeleteAccount()">Delete account</a></li>
            <li><a href="#" id="logout-btn">Log out</a></li>
          </ul>

          <!-- Real-time clock -->
          <div class="clock" id="clock"></div>
        </nav>
      </div>

      <!-- Page title -->
      <h1 class="title">TASK LIST</h1>    

      <!-- Application logo -->
      <div class="logo">
        <span class="logo-text" style="font-weight:800">ListUp</span>
      </div>
    </header>

    <!-- Search bar -->
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="SEARCH" class="search-input">
      <button class="btn-buscar">🔍</button>
      <button class="btn-crear" href="#" onclick="goToCreateTask()">New Task</button>
    </div>

    <!-- Kanban board with three columns -->
    <div class="kanban-board">
      <!-- To Do column -->
      <div class="column">
        <h2 class="column-header todo-header">TO DO</h2>
        <div class="column-content" id="todo-column">
          <!-- "To Do" tasks will be dynamically added here by task.js -->
        </div>
      </div>

      <!-- Doing column -->
      <div class="column">
        <h2 class="column-header doing-header">DOING</h2>
        <div class="column-content" id="doing-column">
          <!-- "Doing" tasks will be dynamically added here by task.js -->
        </div>
      </div>

      <!-- Done column -->
      <div class="column">
        <h2 class="column-header done-header">DONE</h2>
        <div class="column-content" id="done-column">
          <!-- "Done" tasks will be dynamically added here by task.js -->
        </div>
      </div>
    </div>
  </div>

  <!-- Modal to confirm task deletion -->
  <div id="miModal" class="modal">
    <div class="modal-content">
      <p>Are you sure you want to delete this task?</p>
      <button id="cancelar">Cancel</button>
      <button id="confirmar">Delete</button>
    </div>
  </div>

  <!-- Footer with site map -->
  <footer>
    <div class="footer-content">
      <p>&copy; 2025 ListUp. All rights reserved.</p>
      <nav class="footer-nav">
        <a href="map.html">Site Map</a> 
      </nav>
    </div>
  </footer>

  <!-- Script that handles dynamic task loading, deletion and events -->
  <script src="../js/task.js"></script>
  <!-- Script that handles redirection and logout functionality -->
  <script src="../js/auth.js"></script>
</body>
</html>
