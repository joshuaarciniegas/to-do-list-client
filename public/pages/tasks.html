<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lista de Tareas - Kanban — ListUp</title>

  <!-- Conexión a Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS específico para la página de tareas -->
  <link rel="stylesheet" href="../css/tasks.css">
</head>
<body>
  <div class="container">

    <!-- Header de la página -->
    <header class="header">
      <div class="header-left">
        <!-- Botón para ir al perfil -->
        <button class="nav-button profile-button" onclick="goToProfile()">
          <span class="user-icon">👤</span> Perfil
        </button>

        <!-- Botón para crear una nueva tarea -->
        <button class="nav-button create-button" onclick="goToCreateTask()">
          <span class="plus-icon">＋</span> Nueva Tarea
        </button>
      </div>

      <!-- Título de la página -->
      <h1 class="title">LISTA DE TAREAS</h1>

      <!-- Logo de la aplicación -->
      <div class="logo">
        <span class="logo-text" style="font-weight:800">ListUp</span>
      </div>
    </header>

    <!-- Barra de búsqueda -->
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="BUSCAR" class="search-input">
      <button class="search-button">🔍</button>
    </div>

    <!-- Tablero Kanban con tres columnas -->
    <div class="kanban-board">
      <!-- Columna Por hacer -->
      <div class="column">
        <h2 class="column-header todo-header">POR HACER</h2>
        <div class="column-content" id="todo-column">
          <!-- Aquí se agregarán dinámicamente las tareas "Por hacer" desde task.js -->
        </div>
      </div>

      <!-- Columna Haciendo -->
      <div class="column">
        <h2 class="column-header doing-header">HACIENDO</h2>
        <div class="column-content" id="doing-column">
          <!-- Aquí se agregarán dinámicamente las tareas "Haciendo" desde task.js -->
        </div>
      </div>

      <!-- Columna Hecho -->
      <div class="column">
        <h2 class="column-header done-header">HECHO</h2>
        <div class="column-content" id="done-column">
          <!-- Aquí se agregarán dinámicamente las tareas "Hecho" desde task.js -->
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para confirmar eliminación de tarea -->
  <div id="miModal" class="modal">
    <div class="modal-content">
      <p>¿Seguro que deseas borrar esta tarea?</p>
      <button id="cancelar">Cancelar</button>
      <button id="confirmar">Eliminar</button>
    </div>
  </div>
  
  <!-- Script que maneja la carga dinámica de tareas, eliminación y eventos -->
  <script src="../js/task.js"></script>
</body>
</html>
