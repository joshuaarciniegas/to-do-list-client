<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Eliminar cuenta — ListUp</title>

  <!-- Conexión a fuentes de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS específico de la página -->
  <link rel="stylesheet" href="../css/deleteaccount.css">
</head>
<body>
  <div class="frame">
    <!-- Sidebar con logo, descripción y botón de volver -->
    <aside class="sidebar">
      <div class="brand">
        <img src="../previews/todolist.png" alt="Logo empresa">
        <div>
          <h1>ListUp</h1>
          <p>Eliminación de cuenta</p>
        </div>
      </div>

      <!-- Botón de volver al inicio -->
      <a href="tasks.html" class="btn-back">← Volver al inicio</a>
    </aside>

    <!-- Área principal donde se muestra el contenido de eliminación de cuenta -->
    <main class="main">
      <div class="card">
        <h2>¿Seguro que deseas ELIMINAR tu cuenta?</h2>
        <p>Introduce tu contraseña y escribe <strong>ELIMINAR</strong> para confirmar esta acción irreversible.</p>

        <!-- Campos de entrada -->
        <input type="password" placeholder="Contraseña" id="password">
        <input type="text" placeholder='Escribe "ELIMINAR" para confirmar' id="confirmText">

        <!-- Botones de acción -->
        <div class="buttons">
          <!-- Botón de cancelar redirige a perfil -->
          <button class="btn cancel" onclick="window.location.href='profile.html'">Cancelar</button>
          <!-- Botón de eliminar llama a la función deleteAccount() -->
          <button class="btn delete" onclick="deleteAccount()">Eliminar</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal que se muestra al eliminar la cuenta -->
  <div id="successModal" class="modal">
    <div class="modal-content">
      <h3>CUENTA ELIMINADA</h3>
      <p>Tu cuenta ha sido eliminada con éxito.</p>
      <!-- Botón para cerrar modal y redirigir -->
      <button onclick="closeModal()">Cerrar</button>
    </div>
  </div>
  <script src="../js/deleteaccount.js"></script>
</body>
</html>
