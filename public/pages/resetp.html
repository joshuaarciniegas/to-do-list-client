<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password — ListUp</title>

  <!-- Google Fonts connection -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../previews/WhatsApp-Image-2025-09-28-at-11.02.45-PM.ico">

  <!-- CSS specific to password reset page -->
  <link rel="stylesheet" href="../css/resetp.css">
</head>
<body>
  <div class="frame">
    <!-- Sidebar with logo and description -->
    <aside class="sidebar">
      <div class="brand">
        <img src="../previews/todolist.png" alt="ListUp Logo">
        <div>
          <h1>ListUp</h1>
          <p>Reset Password</p>
        </div>
      </div>    
    </aside>

    <!-- Main area for resetting the password -->
    <main class="main">
      <div class="card">
        <h2>Reset your password</h2>

        <!-- Form to input the new password -->
        <form id="resetForm">
          <!-- Input field for the new password -->
          <label for="new-password">New password:</label>
          <input type="password" id="new-password" placeholder="••••••••" required>

          <!-- Input field to confirm the new password -->
          <label for="confirm-password">Confirm password:</label>
          <input type="password" id="confirm-password" placeholder="••••••••" required>

          <!-- Error message displayed if passwords do not match -->
          <p id="error-message" class="error-message">Passwords do not match</p>

          <!-- Additional information about password requirements -->
          <p class="info-text">Your password must contain at least 8 characters, include uppercase, lowercase, and a number</p>

          <!-- Submit button to update the password -->
          <button type="submit">Update Password</button>
        </form>
      </div>
    </main>
  </div>

  <!-- Script containing the validation and password reset logic -->
  <script src="../js/resetp.js"></script>
</body>
</html>
