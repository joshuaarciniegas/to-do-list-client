<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ListUp - Inicio de Sesión</title>

  <!-- Conexión a Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS específico de la página de login -->
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="frame">
    <!-- Sidebar con logo y descripción -->
    <aside class="sidebar">
      <div class="brand">
        <img src="previews/todolist.png" alt="Logo">
        <div>
          <h1>ListUp</h1>
          <p>Organiza tus tareas</p>
        </div>
      </div>
    </aside>

    <!-- Área principal para iniciar sesión -->
    <main class="main">
      <div class="card">
        <h2>INICIAR SESIÓN</h2>

        <!-- Formulario de login -->
        <form id="login-form">
          <!-- Campo de correo -->
          <label for="email">Correo:</label>
          <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>

          <!-- Campo de contraseña -->
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" placeholder="• • • • • • • •" required>

          <!-- Enlaces adicionales -->
          <div class="links">
            <!-- Enlace a recuperación de contraseña -->
            <a href="pages/forgot.html" class="forgot">¿Olvidaste tu contraseña?</a>
            <!-- Enlace para registrarse -->
            <a href="pages/signup.html" class="register-link">¿Deseas registrarte?</a>
          </div>

          <!-- Botón para enviar el formulario -->
          <button type="submit">INGRESAR</button>
        </form>
      </div>
    </main>
  </div>

  <!-- Script que contiene la lógica de autenticación -->
  <script src="js/auth.js"></script>
</body>
</html>
