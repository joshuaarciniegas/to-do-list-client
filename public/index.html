<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ListUp - Login</title>

  <!-- Google Fonts connection -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="previews/WhatsApp-Image-2025-09-28-at-11.02.45-PM.ico">

  <!-- CSS specific to the login page -->
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="frame">
    <!-- Sidebar with logo and description -->
    <aside class="sidebar">
      <div class="brand">
        <img src="previews/todolist.png" alt="Logo">
        <div>
          <h1>ListUp</h1>
          <p>Organize your tasks</p>
        </div>
      </div>
    </aside>

    <!-- Main area for login -->
    <main class="main">
      <div class="card">
        <h2>LOGIN</h2>

        <!-- Login form -->
        <form id="login-form">
          <!-- Email field -->
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="example@email.com" required>

          <!-- Password field -->
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" placeholder="• • • • • • • •" required>

          <!-- Additional links -->
          <div class="links">
            <!-- Link to password recovery -->
            <a href="pages/forgot.html" class="forgot">Forgot your password?</a>
            <!-- Link to sign up -->
            <a href="pages/signup.html" class="register-link">Don't have an account? Sign up</a>
          </div>

          <!-- Button to submit the form -->
          <button type="submit">LOGIN</button>
        </form>
      </div>
    </main>
  </div>

  <!-- Script that contains the authentication logic -->
  <script src="js/auth.js"></script>
</body>
</html>
